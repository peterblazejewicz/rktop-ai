[package]
name = "rktop-ai"
version = "0.2.0"
edition = "2021"
authors = ["Alex Jokela <alex@camulus.com>", "Piotr Błażejewicz (Peter Blazejewicz) (@peterblazejewicz) <peterblazejewicz@users.noreply.github.com>"]
license = "BSD-3-Clause"
description = "High-performance system and PCIe AI accelerator monitor for Rockchip platforms (RK3576, RK3588, RK1828) with real-time CPU, GPU, NPU, and VRAM monitoring"
repository = "https://github.com/ajokela/rktop"
readme = "README.md"
keywords = ["rockchip", "system-monitor", "rk3588", "embedded", "tui"]
categories = ["command-line-utilities", "embedded"]

[dependencies]
ratatui = "0.28"
crossterm = "0.28"
sysinfo = "0.32"
regex = "1.11"
anyhow = "1.0"
thiserror = "2.0"
nix = { version = "0.29", features = ["user", "fs"] }
libc = "0.2"
goblin = "0.9"

[profile.release]
lto = "fat"           # Enable link-time optimization
codegen-units = 1     # Better optimization, slower compile
opt-level = 3         # Maximum optimization
strip = true          # Strip symbols from binary
